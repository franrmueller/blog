<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-label="The user's identity travels from the user, through the agent and the gateway, into the SAP application.">
  <rect class="box" x="20" y="18" width="150" height="40" rx="4"/>
  <text x="95" y="43" text-anchor="middle">Identity provider</text>
  <path class="dim" d="M95 58v40"/>
  <path class="dim" d="M91 92l4 6 4-6"/>
  <text class="small accent" x="104" y="82">token</text>

  <rect class="box" x="20" y="120" width="150" height="44" rx="4"/>
  <text x="95" y="147" text-anchor="middle">User</text>

  <rect class="box" x="220" y="120" width="150" height="44" rx="4"/>
  <text x="295" y="147" text-anchor="middle">Agent</text>

  <rect class="box" x="420" y="120" width="150" height="44" rx="4"/>
  <text x="495" y="147" text-anchor="middle">Gateway</text>

  <rect class="box" x="620" y="120" width="160" height="44" rx="4"/>
  <text x="700" y="147" text-anchor="middle">SAP application</text>

  <path class="flow" d="M170 142h50M370 142h50M570 142h50"/>
  <path class="flow" d="M212 137l8 5-8 5M412 137l8 5-8 5M612 137l8 5-8 5"/>
  <circle class="dot" cx="170" cy="142" r="3.5"/>
  <circle class="dot" cx="370" cy="142" r="3.5"/>
  <circle class="dot" cx="570" cy="142" r="3.5"/>
  <text class="small accent" x="400" y="108" text-anchor="middle">the user's identity, unchanged at every hop</text>

  <text class="small" x="95" y="190" text-anchor="middle">signs in, receives the token</text>
  <text class="small" x="295" y="190" text-anchor="middle">carries the token forward</text>
  <text class="small" x="295" y="208" text-anchor="middle">holds no SAP credentials</text>
  <text class="small" x="495" y="190" text-anchor="middle">exchanges the token</text>
  <text class="small" x="495" y="208" text-anchor="middle">owns the connection into SAP</text>
  <text class="small" x="700" y="190" text-anchor="middle">sees a call from the user</text>
  <text class="small" x="700" y="208" text-anchor="middle">authorizes as the user</text>

  <text class="small" x="400" y="262" text-anchor="middle">The agent is in the chain. It is never in charge of it.</text>
</svg>
