  <path class="flow" d="M752 297l8 5-8 5M752 327l8 5-8 5M752 357l8 5-8 5M752 387l8 5-8 5M752 417l8 5-8 5"/>
  <text x="770" y="306">Finance</text>
  <text x="770" y="336">Health</text>
  <text x="770" y="366">Time</text>
  <text x="770" y="396">Knowledge</text>
  <text x="770" y="426">Controlling</text>

