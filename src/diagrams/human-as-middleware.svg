<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-label="Today, five tools each connect only through the head, which integrates them by hand and decides from memory. In a Personal Resource Planning system, the watch, planner, bank and knowledge notes post into one journal that the modules read, and the head only reads the weekly close." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text class="label accent" x="20" y="24">TODAY</text>

  <text x="20" y="70">Watch</text>
  <text x="20" y="100">Knowledge</text>
  <text x="20" y="130">Bank</text>
  <text x="20" y="160">Habit tracker</text>
  <text x="20" y="190">Planner</text>

  <path class="dim" d="M150 66c115 0 115 64 230 64M150 96c115 0 115 34 230 34M150 126c115 0 115 4 230 4M150 156c115 0 115-26 230-26M150 186c115 0 115-56 230-56"/>
  <path class="dim" d="M372 125l8 5-8 5"/>
  <text class="small" x="265" y="52" text-anchor="middle">typed by hand, every day</text>

  <rect class="box" x="380" y="108" width="140" height="44" rx="4"/>
  <text x="450" y="135" text-anchor="middle">Head</text>
  <text class="small" x="450" y="176" text-anchor="middle">database, integration, scheduler, alerts</text>
  <text class="small" x="450" y="194" text-anchor="middle">runs on biological RAM</text>

  <path class="dim" d="M520 130c120 0 120-34 240-34M520 130h240M520 130c120 0 120 34 240 34"/>
  <path class="dim" d="M752 91l8 5-8 5M752 125l8 5-8 5M752 159l8 5-8 5"/>
  <text class="small" x="640" y="76" text-anchor="middle">decided from memory</text>
  <text x="770" y="100">Training plan</text>
  <text x="770" y="134">Budget</text>
  <text x="770" y="168">The week</text>

  <text class="small" x="450" y="232" text-anchor="middle">five apps, five interfaces, one overloaded server in the middle</text>

  <path class="rule" d="M20 256h860"/>

  <text class="label small" x="20" y="290">PERSONAL RESOURCE PLANNING</text>

  <text x="20" y="320">Watch</text>
  <text x="20" y="350">Planner</text>
  <text x="20" y="380">Bank</text>
  <text x="20" y="410">Knowledge</text>

  <path class="flow" d="M150 316c115 0 115 40 230 40M150 346c115 0 115 10 230 10M150 376c115 0 115-20 230-20M150 406c115 0 115-50 230-50"/>
  <path class="flow" d="M372 351l8 5-8 5"/>
  <text class="small accent" x="450" y="318" text-anchor="middle">one event, recorded once, true everywhere it matters</text>

  <rect class="box" x="380" y="334" width="140" height="44" rx="4"/>
  <text x="450" y="361" text-anchor="middle">Journal</text>

